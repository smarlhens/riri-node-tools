name: pr-action

on:
  pull_request:
    paths:
      - ".github/actions/bench-compare/**"
      - ".github/workflows/pr-action.yml"
      - "bench-js/**"
      - ".oxfmtrc.json"
      - "oxlintrc.json"
  push:
    branches:
      - main
    paths:
      - ".github/actions/bench-compare/**"
      - ".github/workflows/pr-action.yml"
      - "bench-js/**"
      - ".oxfmtrc.json"
      - "oxlintrc.json"

permissions:
  contents: read

env:
  ACTION_DIR: .github/actions/bench-compare

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  bench-compare:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: .github/actions/bench-compare
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .github/actions/bench-compare/.nvmrc
          cache: npm
          cache-dependency-path: .github/actions/bench-compare/package-lock.json

      - name: Install bench-js dependencies
        working-directory: bench-js
        run: npm ci

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npx oxlint --config "$GITHUB_WORKSPACE/oxlintrc.json"

      - name: Format check
        run: npx oxfmt --config "$GITHUB_WORKSPACE/.oxfmtrc.json" --check

      - name: Bundle
        run: npm run bundle
