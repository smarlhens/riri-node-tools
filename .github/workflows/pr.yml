name: pr

on:
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  prek:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install
      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: prek
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Run prek hooks
        uses: ./.github/actions/setup-prek

  rust:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install
      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check errors
        run: cargo check --workspace
      - name: Lint
        run: cargo clippy --workspace --all-targets
      - name: Check the library-only configuration
        run: cargo check -p riri-nce -p riri-ncd -p riri-npd --no-default-features
      - name: Lint the refresh path
        run: cargo clippy -p riri-nce --features refresh --all-targets
      - name: Test
        run: cargo test --workspace --verbose

  msrv:
    uses: ./.github/workflows/msrv.yml

  readme-drift:
    name: readme-drift - ${{ matrix.crate.name }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        crate:
          - name: nce
            dir: crates/riri-napi-nce
          - name: ncd
            dir: crates/riri-napi-ncd
          - name: npd
            dir: crates/riri-napi-npd
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install
      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: readme-drift-${{ matrix.crate.name }}
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ matrix.crate.dir }}/.nvmrc
          cache: npm
          cache-dependency-path: ${{ matrix.crate.dir }}/package-lock.json
      - name: Build napi binary
        env:
          CRATE_DIR: ${{ matrix.crate.dir }}
        run: |
          cd "$CRATE_DIR"
          npm ci
          npx napi build --platform --release
      - name: Check README drift
        run: cargo run -p xtask -- regen-readme --check --crate-name ${{ matrix.crate.name }}

  readme-drift-root:
    name: readme-drift - root
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install
      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: readme-drift-root
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install prek
        uses: ./.github/actions/setup-prek
        with:
          install-only: true
      - name: Check README drift
        run: cargo run -p xtask -- regen-readme --check --crate-name root
