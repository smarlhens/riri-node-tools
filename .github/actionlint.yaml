self-hosted-runner:
  # ubuntu-26.04 is GitHub-hosted, not self-hosted: actionlint simply does not know the label yet.
  # Drop this once https://github.com/rhysd/actionlint/pull/683 ships in a release.
  labels:
    - ubuntu-26.04
paths:
  .github/workflows/pr-bench.yml:
    # bench-compare is a JS action whose dist/ is built at runtime
    # (npm ci && npm run bundle) in the workflow before invocation,
    # so the static check for the bundle file is a false positive.
    ignore:
      - 'file "dist/index.js" does not exist'
  .github/workflows/dist.yml:
    # generated by cargo-dist; its shell snippets are upstream boilerplate
    # (allow-dirty = ["ci"]), so shellcheck style/info nits are not ours to fix.
    ignore:
      - "shellcheck reported issue in this script: SC2086:.+"
      - "shellcheck reported issue in this script: SC2129:.+"
